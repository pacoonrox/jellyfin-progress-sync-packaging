name: Publish progress sync Jellyfin image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  IMAGE_VERSION: progress-sync

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out packaging
        uses: actions/checkout@v4

      - name: Resolve pinned source commits
        id: sources
        run: |
          echo "server=$(git rev-parse HEAD:jellyfin-server)" >> "$GITHUB_OUTPUT"
          echo "web=$(git rev-parse HEAD:jellyfin-web)" >> "$GITHUB_OUTPUT"

      - name: Remove placeholder submodule directories
        run: |
          rm -rf jellyfin-server jellyfin-web

      - name: Check out Jellyfin server fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.JELLYFIN_SERVER_REPOSITORY }}
          ref: ${{ steps.sources.outputs.server }}
          path: jellyfin-server
          fetch-depth: 0

      - name: Check out Jellyfin web fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.JELLYFIN_WEB_REPOSITORY }}
          ref: ${{ steps.sources.outputs.web }}
          path: jellyfin-web
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Jellyfin image
        run: |
          ./build.py "$IMAGE_VERSION" docker amd64 --local

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/jellyfin-server-progress-sync"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker tag "jellyfin/jellyfin:${IMAGE_VERSION}-amd64" "$BASE:latest"
          docker tag "jellyfin/jellyfin:${IMAGE_VERSION}-amd64" "$BASE:$SHA_TAG"
          docker push "$BASE:latest"
          docker push "$BASE:$SHA_TAG"
